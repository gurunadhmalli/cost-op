server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API -> the backend container (docker-compose service name).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSockets (/ws/chat, /ws/live) need the upgrade headers explicitly —
    # nginx doesn't forward them by default.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Client-side routing (React Router) — fall back to index.html for any
    # path that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
